
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            font-family: Arial, sans-serif;
        }

        .book-form {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 15px 40px rgba(40, 20, 80, 0.25);
            border-top: 7px solid #ff6b9d;
        }

        .book-form h2 {
            text-align: center;
            color: #6c3db5;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
        }

        .form-label {
            color: #49336f;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 11px;
            border: 2px solid #e5dafa;
            border-radius: 10px;
            background-color: #fcfaff;
        }

        .form-control:focus {
            border-color: #a66bea;
            box-shadow: 0 0 8px rgba(166, 107, 234, 0.25);
        }

        input[type="file"] {
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #7b2ff7, #f107a3);
            color: white;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(123, 47, 247, 0.3);
        }

        .book-icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <form method="POST" enctype="multipart/form-data" class="book-form">
        {% csrf_token %}

        <div class="book-icon">📚</div>
        <h2>Add a New Book</h2>
        <p class="subtitle">Fill in the details to add to your library</p>

        <div class="mb-3">
            <label class="form-label" for="title">📖 Book Title</label>
            <input type="text" class="form-control" id="title"
                   name="t" placeholder="Enter book title" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="author">✍️ Author Name</label>
            <input type="text" class="form-control" id="author"
                   name="a" placeholder="Enter author name" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="price">💰 Price (₹)</label>
            <input type="number" class="form-control" id="price"
                   name="p" placeholder="Enter book price"
                   min="0" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="pdf">📄 Upload Book PDF</label>
            <input type="file" class="form-control" id="pdf"
                   name="f" accept=".pdf">
        </div>

        <div class="mb-3">
            <label class="form-label" for="cover">🖼️ Upload Book Cover</label>
            <input type="file" class="form-control" id="cover"
                   name="c" accept="image/*">
        </div>

        <button type="submit" class="submit-btn">
            ✨ Add Book
        </button>
    </form>

</body>
</html>
