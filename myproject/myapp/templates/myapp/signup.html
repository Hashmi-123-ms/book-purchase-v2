
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Books Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
        }

        /* Signup Card */

        .signup-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.97);
            padding: 35px 40px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(40, 20, 80, 0.25);
            border-top: 7px solid #ff6b9d;
        }

        /* Heading */

        .signup-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 8px;
        }

        .heading {
            color: #6c3db5;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Input Fields */

        .input-field {
            margin-bottom: 17px;
        }

        .input-field label {
            display: block;
            color: #49336f;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5dafa;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-field input:focus {
            border-color: #a66bea;
            box-shadow: 0 0 8px rgba(166, 107, 234, 0.25);
        }

        /* Register Button */

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(90deg, #7b2ff7, #f107a3);
            box-shadow: 0 6px 18px rgba(70, 20, 100, 0.2);
            transition: 0.3s;
            margin-top: 8px;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            color: white;
        }

        /* Login Link */

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .login-text a {
            color: #764ba2;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            color: #f107a3;
            text-decoration: underline;
        }

        /* Home Link */

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link:hover {
            color: #f107a3;
        }

        /* Responsive */

        @media (max-width: 576px) {

            .signup-card {
                padding: 28px 22px;
            }

            .heading {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

    <div class="signup-card">

        <!-- Book Icon -->

        <div class="signup-icon">
            📚
        </div>

        <!-- Heading -->

        <div class="heading">
            Create Account
        </div>

        <p class="subtitle">
            Join our Books Collection and discover new stories!
        </p>


        <!-- Signup Form -->

        <form action="" method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="input-field">

                <label>Username</label>

                <input type="text"
                       name="u"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>

            </div>


            <!-- Email -->

            <div class="input-field">

                <label>Email Address</label>

                <input type="email"
                       name="e"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>

            </div>


            <!-- First Name -->

            <div class="input-field">

                <label>First Name</label>

                <input type="text"
                       name="f"
                       placeholder="Enter your first name"
                       autocomplete="given-name"
                       required>

            </div>


            <!-- Last Name -->

            <div class="input-field">

                <label>Last Name</label>

                <input type="text"
                       name="l"
                       placeholder="Enter your last name"
                       autocomplete="family-name"
                       required>

            </div>


            <!-- Password -->

            <div class="input-field">

                <label>Password</label>

                <input type="password"
                       name="p"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       required>

            </div>


            <!-- Confirm Password -->

            <div class="input-field">

                <label>Confirm Password</label>

                <input type="password"
                       name="cp"
                       placeholder="Confirm your password"
                       autocomplete="new-password"
                       required>

            </div>


            <!-- Register Button -->

            <button type="submit" class="register-btn">
                ✨ Create Account
            </button>

        </form>


        <!-- Login Link -->

        <div class="login-text">

            Already have an account?

            <a href="{% url 'signin' %}">
                Login Here
            </a>

        </div>


        <!-- Home Link -->

        <a href="/" class="home-link">
            ← Back to Books Collection
        </a>

    </div>

</body>
</html>
