
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful | Novel Nest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            font-family: Arial, sans-serif;
        }

        .success-card {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            border-top: 6px solid #f093fb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .success-icon {
            font-size: 75px;
            color: #28a745;
            margin-bottom: 15px;
        }

        h2 {
            color: #764ba2;
            font-weight: bold;
        }

        .message {
            color: #666;
            margin-top: 15px;
            font-size: 16px;
        }

        .home-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .home-btn:hover {
            color: white;
            opacity: 0.9;
        }

        #countdown {
            color: #764ba2;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">✓</div>

        <h2>Order Placed Successfully!</h2>

        <p class="message">
            Thank you for shopping with <b>Novel Nest!</b>
        </p>

        <p class="message">
            Your order has been confirmed.
            Happy Reading! 📚
        </p>

        <p class="mt-4">
            Redirecting to homepage in
            <span id="countdown">3</span> seconds...
        </p>

        <a href="/" class="home-btn">
            Go to Homepage
        </a>

    </div>

    <script>
        let seconds = 3;

        let timer = setInterval(function() {

            seconds--;

            document.getElementById("countdown").textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "/";
            }

        }, 1000);
    </script>

</body>
</html>
